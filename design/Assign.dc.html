<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Manrope', -apple-system, system-ui, sans-serif;
           background: #F1F2F4; color: #1B1D21; -webkit-font-smoothing: antialiased; }
    a { color: #2C5FE0; } a:hover { color: #1f47ad; }
  </style>
</helmet>

<div style="min-height: 812px; background: #F1F2F4; display: flex; flex-direction: column;">

  <div style="height: 50px;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 8px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B1D21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-size: 16px; font-weight: 700;">Assign items</div>
    <div style="width: 21px;"></div>
  </div>

  <!-- people chips -->
  <div style="display: flex; gap: 8px; padding: 2px 16px 4px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 5px; border-radius: 999px; background: #2C5FE0;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.22); color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">AL</div>
      <span style="font-size: 13px; font-weight: 700; color: #fff;">Alex</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 5px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E5EA;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">SA</div>
      <span style="font-size: 13px; font-weight: 600; color: #3A3F47;">Sam</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 5px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E5EA;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">JO</div>
      <span style="font-size: 13px; font-weight: 600; color: #3A3F47;">Jordan</span>
    </div>
  </div>

  <div style="font-size: 12.5px; font-weight: 600; color: #868C95; padding: 4px 16px 8px;">Tap items to add them for <span style="color: #2C5FE0; font-weight: 700;">Alex</span></div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px; flex-grow: 1;">

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 13px; padding: 11px 14px;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #2C5FE0; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 15px; font-weight: 700;">Cheeseburger</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">$14.50</div>
      </div>
      <div style="margin-left: auto; display: flex;">
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #3B6FE0; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff;">AL</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 13px; padding: 11px 14px;">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: #2C5FE0; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 15px; font-weight: 700;">Fries</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">$6.50 · shared 2 ways</div>
      </div>
      <div style="margin-left: auto; display: flex;">
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #3B6FE0; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff;">AL</div>
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -9px;">JO</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 13px; padding: 11px 14px;">
      <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #D3D6DC;"></div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 15px; font-weight: 700;">Tiramisu</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">$9.00 · shared 3 ways</div>
      </div>
      <div style="margin-left: auto; display: flex;">
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff;">SA</div>
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -9px;">JO</div>
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #7A6FE0; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -9px;">TA</div>
      </div>
    </div>

    <!-- unassigned: quiet neutral emphasis, not warm -->
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1.5px solid #C9CDD4; border-radius: 13px; padding: 11px 14px;">
      <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #AEB3BB;"></div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 15px; font-weight: 700;">Negroni</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">$12.00</div>
      </div>
      <div style="margin-left: auto; font-size: 11.5px; font-weight: 700; color: #6B717A; background: #EEF0F3; padding: 4px 9px; border-radius: 999px;">Unassigned</div>
    </div>

  </div>

  <div style="padding: 12px 16px 0;">
    <div style="text-align: center; font-size: 12.5px; font-weight: 600; color: #868C95; margin-bottom: 9px;">5 of 6 items assigned</div>
    <div style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: #2C5FE0; color: #fff; font-size: 15px; font-weight: 700; opacity: 0.5;">
      Next: Tip &amp; tax
    </div>
  </div>

  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #E6E8EC; padding: 9px 0 20px; margin-top: 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2C5FE0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2C5FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Receipt</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #A6ABB3;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#A6ABB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l6.3 3.9-2.3 2.3H4.5a1 1 0 0 0-.8 1.6l2.5 2.9"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Trips</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
