<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    body { margin: 0; font-family: 'Nunito', -apple-system, "SF Pro Rounded", system-ui, sans-serif;
           background: #F5F4EF; color: #26262B; -webkit-font-smoothing: antialiased; }
    a { color: #2F6BFF; } a:hover { color: #1e50cc; }
  </style>
</helmet>

<div style="min-height: 844px; background: #F5F4EF; display: flex; flex-direction: column;">

  <div style="height: 54px;"></div>

  <!-- nav -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 18px 10px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26262B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-size: 17px; font-weight: 800;">Lisbon Trip</div>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#26262B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
  </div>

  <!-- segmented -->
  <div style="margin: 2px 18px 0; display: flex; gap: 4px; background: #E7E5DD; border-radius: 14px; padding: 4px;">
    <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 700; color: #8E8E98;">Expenses</div>
    <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 800; color: #26262B; background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 6px rgba(30,30,40,0.10);">Balances</div>
    <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 700; color: #8E8E98;">People</div>
  </div>

  <div style="padding: 16px 18px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

    <!-- balances -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 18px; padding: 13px 16px; box-shadow: 0 4px 12px rgba(30,30,40,0.05);">
        <div style="width: 42px; height: 42px; border-radius: 50%; background: #F5811E; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;">SA</div>
        <div style="font-size: 17px; font-weight: 800;">Sam</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 12px; font-weight: 700; color: #8E8E98;">gets back</div>
          <div style="font-size: 18px; font-weight: 900; color: #1FA85C;">$86.00</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 18px; padding: 13px 16px; box-shadow: 0 4px 12px rgba(30,30,40,0.05);">
        <div style="width: 42px; height: 42px; border-radius: 50%; background: #2F6BFF; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;">AL</div>
        <div style="font-size: 17px; font-weight: 800;">Alex</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 12px; font-weight: 700; color: #8E8E98;">owes</div>
          <div style="font-size: 18px; font-weight: 900; color: #E5544B;">$47.00</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; background: #FFFFFF; border-radius: 18px; padding: 13px 16px; box-shadow: 0 4px 12px rgba(30,30,40,0.05);">
        <div style="width: 42px; height: 42px; border-radius: 50%; background: #2FB56A; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;">JO</div>
        <div style="font-size: 17px; font-weight: 800;">Jordan</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 12px; font-weight: 700; color: #8E8E98;">owes</div>
          <div style="font-size: 18px; font-weight: 900; color: #E5544B;">$39.00</div>
        </div>
      </div>
    </div>

    <!-- settle up card -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 6px 4px 8px; box-shadow: 0 6px 18px rgba(30,30,40,0.06);">
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1FA85C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span style="font-size: 15px; font-weight: 800;">Settle up in 2 payments</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 16px;">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #2F6BFF; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;">AL</div>
        <span style="font-size: 15px; font-weight: 700;">Alex</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7B7BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #F5811E; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;">SA</div>
        <span style="font-size: 15px; font-weight: 700;">Sam</span>
        <span style="margin-left: auto; font-size: 17px; font-weight: 900;">$47.00</span>
      </div>
      <div style="height: 1px; background: #F0EEE7; margin: 0 16px;"></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 16px;">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #2FB56A; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;">JO</div>
        <span style="font-size: 15px; font-weight: 700;">Jordan</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7B7BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #F5811E; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;">SA</div>
        <span style="font-size: 15px; font-weight: 700;">Sam</span>
        <span style="margin-left: auto; font-size: 17px; font-weight: 900;">$39.00</span>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 18px; background: linear-gradient(135deg, #12B3A6 0%, #2F6BFF 100%); color: #fff; font-size: 17px; font-weight: 800; box-shadow: 0 10px 22px rgba(47,107,255,0.28);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
      Share settle-up
    </div>
  </div>

  <!-- tab bar -->
  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #ECEAE3; padding: 10px 0 22px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B7B7BE;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B7B7BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Receipt</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2F6BFF;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l6.3 3.9-2.3 2.3H4.5a1 1 0 0 0-.8 1.6l2.5 2.9"/></svg>
      <span style="font-size: 11px; font-weight: 800;">Trips</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
