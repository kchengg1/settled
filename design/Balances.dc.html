<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Manrope', -apple-system, system-ui, sans-serif;
           background: #F1F2F4; color: #1B1D21; -webkit-font-smoothing: antialiased; }
    a { color: #2C5FE0; } a:hover { color: #1f47ad; }
  </style>
</helmet>

<div style="min-height: 812px; background: #F1F2F4; display: flex; flex-direction: column;">

  <div style="height: 50px;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 10px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B1D21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-size: 16px; font-weight: 700;">Lisbon Trip</div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A4F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
  </div>

  <!-- segmented -->
  <div style="margin: 0 16px; display: flex; gap: 3px; background: #E4E6EA; border-radius: 11px; padding: 3px;">
    <div style="flex: 1; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 600; color: #868C95;">Expenses</div>
    <div style="flex: 1; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 700; color: #1B1D21; background: #FFFFFF; border-radius: 8px;">Balances</div>
    <div style="flex: 1; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 600; color: #868C95;">People</div>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">SA</div>
        <div style="font-size: 15px; font-weight: 700;">Sam</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 11.5px; font-weight: 600; color: #868C95;">gets back</div>
          <div style="font-size: 16px; font-weight: 800; color: #1F9D57;">$86.00</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #3B6FE0; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">AL</div>
        <div style="font-size: 15px; font-weight: 700;">Alex</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 11.5px; font-weight: 600; color: #868C95;">owes</div>
          <div style="font-size: 16px; font-weight: 800; color: #DC5A4B;">$47.00</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">JO</div>
        <div style="font-size: 15px; font-weight: 700;">Jordan</div>
        <div style="margin-left: auto; text-align: right;">
          <div style="font-size: 11.5px; font-weight: 600; color: #868C95;">owes</div>
          <div style="font-size: 16px; font-weight: 800; color: #DC5A4B;">$39.00</div>
        </div>
      </div>
    </div>

    <!-- settle up -->
    <div style="background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 16px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 7px; padding: 13px 14px 9px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F9D57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span style="font-size: 14px; font-weight: 700;">Settle up in 2 payments</span>
      </div>

      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 14px;">
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #3B6FE0; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">AL</div>
        <span style="font-size: 14px; font-weight: 600;">Alex</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6ABB3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">SA</div>
        <span style="font-size: 14px; font-weight: 600;">Sam</span>
        <span style="margin-left: auto; font-size: 15px; font-weight: 800;">$47.00</span>
      </div>
      <div style="height: 1px; background: #EEF0F3; margin: 0 14px;"></div>
      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 14px 12px;">
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">JO</div>
        <span style="font-size: 14px; font-weight: 600;">Jordan</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6ABB3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div style="width: 27px; height: 27px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center;">SA</div>
        <span style="font-size: 14px; font-weight: 600;">Sam</span>
        <span style="margin-left: auto; font-size: 15px; font-weight: 800;">$39.00</span>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 50px; border-radius: 14px; background: #2C5FE0; color: #fff; font-size: 15px; font-weight: 700;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
      Share settle-up
    </div>
  </div>

  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #E6E8EC; padding: 9px 0 20px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #A6ABB3;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#A6ABB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Receipt</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2C5FE0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2C5FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l6.3 3.9-2.3 2.3H4.5a1 1 0 0 0-.8 1.6l2.5 2.9"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Trips</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
