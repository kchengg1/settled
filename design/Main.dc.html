<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Manrope', -apple-system, system-ui, sans-serif;
           background: #F1F2F4; color: #1B1D21; -webkit-font-smoothing: antialiased; }
    a { color: #2C5FE0; } a:hover { color: #1f47ad; }
  </style>
</helmet>

<div style="min-height: 812px; background: #F1F2F4; display: flex; flex-direction: column;">

  <div style="height: 50px;"></div>

  <!-- nav -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 10px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B1D21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="font-size: 16px; font-weight: 700;">Trattoria Roma</div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A4F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
  </div>

  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">

    <!-- hero total -->
    <div style="background: #20242C; border-radius: 18px; padding: 18px 20px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #9AA0AA;">TOTAL SPLIT</div>
      <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-top: 3px; color: #fff;">$54.61</div>
      <div style="font-size: 13px; font-weight: 500; color: #B9BEC7; margin-top: 1px;">4 people · tax &amp; tip included</div>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #868C95; text-transform: uppercase; margin: 0 2px -4px;">Everyone's share</div>

    <!-- person rows -->
    <div style="display: flex; flex-direction: column; gap: 9px;">

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: #3B6FE0; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;">AL</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700;">Alex</div>
          <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">Margherita · shared fries</div>
        </div>
        <div style="margin-left: auto; font-size: 18px; font-weight: 800;">$15.20</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: #667085; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;">SA</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700;">Sam</div>
          <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">Carbonara · espresso</div>
        </div>
        <div style="margin-left: auto; font-size: 18px; font-weight: 800;">$12.85</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: #2E9C8E; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;">JO</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700;">Jordan</div>
          <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">Tiramisu · shared fries</div>
        </div>
        <div style="margin-left: auto; font-size: 18px; font-weight: 800;">$14.30</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E9EBEF; border-radius: 14px; padding: 11px 14px;">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: #7A6FE0; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;">TA</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700;">Taylor</div>
          <div style="font-size: 12.5px; font-weight: 500; color: #868C95;">Negroni · espresso</div>
        </div>
        <div style="margin-left: auto; font-size: 18px; font-weight: 800;">$12.26</div>
      </div>

    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 50px; border-radius: 14px; background: #2C5FE0; color: #fff; font-size: 15px; font-weight: 700;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/></svg>
      Share breakdown
    </div>
  </div>

  <!-- tab bar -->
  <div style="display: flex; background: #FFFFFF; border-top: 1px solid #E6E8EC; padding: 9px 0 20px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2C5FE0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2C5FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
      <span style="font-size: 11px; font-weight: 700;">Receipt</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #A6ABB3;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#A6ABB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l6.3 3.9-2.3 2.3H4.5a1 1 0 0 0-.8 1.6l2.5 2.9"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Trips</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
