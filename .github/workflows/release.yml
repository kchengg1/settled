name: Release to TestFlight

# Manual trigger (Actions tab → Release to TestFlight → Run workflow),
# or push a tag like v1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    name: Archive, sign, and upload
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      # Apple requires the iOS 26 SDK for App Store Connect uploads.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > private_keys/AuthKey.p8

      # Cloud signing: -allowProvisioningUpdates plus the API key lets
      # xcodebuild create/fetch the distribution certificate and profile
      # itself — no keychains or manual certificates.
      - name: Archive (Release, cloud-signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Settled.xcodeproj -scheme Settled \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Settled.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # App Store Connect rejects a reused build number only after the whole
      # upload, so catch an Info.plist that ignores the override here.
      - name: Check the archive's build number
        run: |
          plist=build/Settled.xcarchive/Products/Applications/Settled.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "Archived Settled $version ($build)"
          if [ "$build" != "${{ github.run_number }}" ]; then
            echo "::error::Archive has build number $build, expected ${{ github.run_number }}"
            exit 1
          fi

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Settled.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # A signing failure names the mismatched entitlement but not what Apple
      # actually granted. On failure, print both sides so the fix is plain:
      # the entitlements the app requests, and what each downloaded profile
      # allows.
      - name: Show signing inputs (on failure)
        if: failure()
        run: |
          echo "=== Entitlements the app requests ==="
          cat Settled.entitlements || echo "(not generated)"
          echo
          echo "=== Provisioning profiles Xcode downloaded ==="
          found=0
          while IFS= read -r f; do
            found=1
            security cms -D -i "$f" > /tmp/profile.plist 2>/dev/null || continue
            echo "--- $(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null)"
            plutil -p /tmp/profile.plist \
              | grep -E -A4 '"(application-identifier|com\.apple\.developer\.icloud[^"]*)"' \
              || echo "    (grants no iCloud entitlements)"
          done < <(find ~/Library -name '*.mobileprovision' 2>/dev/null)
          [ "$found" = 1 ] || echo "(no profiles found)"
